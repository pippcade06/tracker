<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <title>Goals &amp; Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Each tab's screen is drawn into <main> by app.js -->
  <main id="view"></main>

  <!-- Rest timer bar (shown after you log a set) -->
  <div id="timer" class="timer hidden" role="timer" aria-live="polite">
    <div id="timer-fill" class="timer-fill"></div>
    <div class="timer-row">
      <div class="timer-text">
        <div id="timer-time" class="timer-time">0:00</div>
        <div id="timer-label" class="timer-label"></div>
      </div>
      <button class="timer-btn" data-action="timer-add" data-by="-15" aria-label="Remove 15 seconds">−15</button>
      <button class="timer-btn" data-action="timer-add" data-by="30" aria-label="Add 30 seconds">+30</button>
      <button class="timer-btn" data-action="timer-stop" aria-label="Stop timer">✕</button>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <nav class="tabbar">
    <button data-action="tab" data-tab="train"><span class="ico">🏋️</span><span>Train</span></button>
    <button data-action="tab" data-tab="check"><span class="ico">✅</span><span>Checklist</span></button>
    <button data-action="tab" data-tab="goals"><span class="ico">🎯</span><span>Goals</span></button>
    <button data-action="tab" data-tab="progress"><span class="ico">📈</span><span>Progress</span></button>
    <button data-action="tab" data-tab="more"><span class="ico">⚙️</span><span>More</span></button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
